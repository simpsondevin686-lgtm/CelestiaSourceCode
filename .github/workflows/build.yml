name: Build Celestia Android

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: n珍惜/setup-ndk@v1
        continue-on-error: true
        with:
          ndk-version: r25c

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Unsigned Release APK & AAB
        run: ./gradlew assembleSideloadRelease bundleSideloadRelease --no-daemon

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celestia-unsigned-apk
          path: app/build/outputs/apk/sideload/release/*.apk

      - name: Upload Unsigned AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celestia-unsigned-aab
          path: app/build/outputs/bundle/sideloadRelease/*.aab
